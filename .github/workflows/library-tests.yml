name: Library source tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: INDIAN_RHYTHMS_PRO/Scripts/requirements.txt
      - run: python -m pip install -r INDIAN_RHYTHMS_PRO/Scripts/requirements.txt
      - run: python -m unittest discover -s INDIAN_RHYTHMS_PRO/Scripts -p 'test_*.py' -v
